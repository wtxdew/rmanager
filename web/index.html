<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>reMarkable Manager</title>
    <link rel="stylesheet" href="/css/pico.min.css">
    <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>reMarkable Manager</strong></li>
            </ul>
            <ul>
                <li><a href="#" onclick="app.switchTab('dashboard'); return false;">Dashboard</a></li>
                <li><a href="#" onclick="app.switchTab('terminal'); return false;">Terminal</a></li>
            </ul>
        </nav>

        <!-- Dashboard Tab -->
        <section id="tab-dashboard">
            <!-- System Status -->
            <article>
                <header>System Status</header>
                <table>
                    <tr>
                        <td>Device Model</td>
                        <td id="sys-model">Loading...</td>
                    </tr>
                    <tr>
                        <td>Uptime</td>
                        <td id="sys-uptime">-</td>
                    </tr>
                    <tr>
                        <td>Storage</td>
                        <td id="sys-storage">-</td>
                    </tr>
                </table>
            </article>

            <!-- Suspend Screen Management -->
            <article>
                <header>Suspend Screen Management</header>
                <div class="preview-grid">
                    <div>
                        <label>Current Screen</label>
                        <img id="current-suspend" src="/api/current-suspend" alt="Current suspend screen">
                    </div>
                    <div>
                        <label>Preview New Screen</label>
                        <img id="preview-suspend" src="" alt="Select image to preview">
                    </div>
                </div>
                <input type="file" id="suspend-file" accept="image/png,image/jpg,image/jpeg"
                       onchange="uploadModule.previewSuspend(this)">
                <button onclick="uploadModule.uploadSuspend()">Upload and Replace</button>
                <p id="suspend-status" class="status-message"></p>
            </article>

            <!-- Document Upload -->
            <article>
                <header>Document Upload</header>
                <input type="file" id="doc-file" accept=".pdf,.epub" multiple>
                <progress id="upload-progress" value="0" max="100"></progress>
                <div class="grid">
                    <button onclick="uploadModule.uploadDocuments()">Upload Documents</button>
                    <button onclick="uploadModule.restartUI()" class="secondary">Restart UI</button>
                </div>
                <p id="doc-status" class="status-message"></p>
            </article>
        </section>

        <!-- Terminal Tab -->
        <section id="tab-terminal" style="display:none;">
            <article>
                <header>Web SSH Terminal</header>
                <p><small>Note: Terminal functionality requires device deployment. Not available in development mode.</small></p>
                <div id="xterm-container"></div>
            </article>
        </section>
    </main>

    <!-- Scripts -->
    <script src="/js/utils.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/upload.js"></script>
</body>
</html>
