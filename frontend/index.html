<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>RMPP Manager</title>
    <style>
      body {
        font-family: -apple-system, sans-serif;
        padding: 40px;
        background: #f0f0f0;
      }
      .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        margin: auto;
      }
      .stat {
        margin: 15px 0;
        border-bottom: 1px solid #eee;
        padding-bottom: 8px;
      }
      .label {
        font-size: 0.8em;
        color: #666;
        text-transform: uppercase;
      }
      .value {
        font-size: 1.1em;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>RMPP 狀態儀表板</h2>
      <div class="stat">
        <div class="label">設備型號</div>
        <div class="value" id="model">載入中...</div>
      </div>
      <div class="stat">
        <div class="label">運行時間</div>
        <div class="value" id="uptime">-</div>
      </div>
      <div class="stat">
        <div class="label">存儲狀態 (Filesystem Size Used Avail Use%)</div>
        <div
          class="value"
          id="storage"
          style="font-family: monospace; font-size: 0.8em"
        >
          -
        </div>
      </div>
      <button onclick="location.reload()">重新整理</button>
      <hr />
      <div class="stat">
        <div class="label">更換休眠畫面 (.png)</div>
        <input type="file" id="suspend-upload" accept="image/png" />
        <button onclick="uploadImage()" id="upload-btn">開始上傳</button>
      </div>
      <p id="upload-status" style="font-size: 0.8em; color: #d32f2f"></p>

      <script>
        function uploadImage() {
          const fileInput = document.getElementById("suspend-upload");
          const status = document.getElementById("upload-status");
          const btn = document.getElementById("upload-btn");

          if (fileInput.files.length === 0) {
            status.innerText = "請先選擇一張圖片！";
            return;
          }

          const formData = new FormData();
          formData.append("image", fileInput.files[0]);

          status.innerText = "正在解鎖系統並上傳...";
          btn.disabled = true;

          fetch("/api/upload-suspend", {
            method: "POST",
            body: formData,
          })
            .then((res) => res.text())
            .then((msg) => {
              status.innerText = msg;
              btn.disabled = false;
            })
            .catch((err) => {
              status.innerText = "上傳失敗: " + err;
              btn.disabled = false;
            });
        }
      </script>

    <style>
      .preview-container {
        display: flex;
        gap: 20px;
        justify-content: center;
        margin-top: 20px;
      }
      .preview-box {
        text-align: center;
        width: 180px;
      }
      .preview-box img {
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #eee;
        height: 240px;
        object-fit: contain;
      }
    </style>

      <h2>休眠畫面管理</h2>

      <div class="preview-container">
        <div class="preview-box">
          <div class="label">設備目前畫面</div>
          <img id="current-img" src="/api/current-suspend" alt="Current" />
        </div>
        <div class="preview-box">
          <div class="label">預覽新畫面</div>
          <img id="new-preview" src="" alt="待選擇..." />
        </div>
      </div>

      <hr />
      <input
        type="file"
        id="suspend-upload"
        accept="image/png"
        onchange="previewLocalImage(this)"
      />
      <button onclick="uploadImage()" id="upload-btn">上傳並更換</button>
      <hr />
      <div class="card">
        <h2>PDF/EPUB 檔案傳輸</h2>
        <div class="stat">
          <input type="file" id="doc-file" accept=".pdf,.epub" />
          <button onclick="uploadDoc()">上傳到我的檔案</button>
        </div>
        <div id="doc-status" style="font-size: 0.8em; margin-top: 10px"></div>

        <button
          onclick="restartUI()"
          style="background: #d32f2f; margin-top: 20px"
        >
          刷新 RMPP 介面 (Restart UI)
        </button>
      </div>

      <script>
        async function uploadDoc() {
          const fileInput = document.getElementById("doc-file");
          const status = document.getElementById("doc-status");
          if (!fileInput.files[0]) return alert("請選擇檔案");

          const formData = new FormData();
          formData.append("file", fileInput.files[0]);

          status.innerText = "正在傳輸...";
          try {
            const res = await fetch("/api/upload-doc", {
              method: "POST",
              body: formData,
            });
            const text = await res.text();
            status.innerText = text + "。請點擊下方按鈕刷新介面以顯示檔案。";
          } catch (e) {
            status.innerText = "上傳失敗: " + e;
          }
        }

        async function restartUI() {
          if (!confirm("重啟介面會導致 RMPP 螢幕暫時閃爍，確定嗎？")) return;
          await fetch("/api/restart-xochitl", { method: "POST" });
          alert("正在重啟...");
        }
      </script>
    </div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.css" />
<script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.js"></script>

<div id="terminal" style="height: 400px; background: #000;"></div>

<script>
// 初始化 Xterm
const term = new Terminal({
    cursorBlink: true,
    convertEol: true, // 重要：處理 \n -> \r\n 的轉換
    fontFamily: 'monospace'
});
term.open(document.getElementById('terminal'));

const socket = new WebSocket(`ws://${window.location.host}/api/ssh`);
socket.binaryType = 'arraybuffer'; // 必須設定

socket.onopen = () => {
    console.log("Connected to Backend");
    // 連線後立刻傳送一個 newline，試圖喚醒 Shell
    socket.send("\n");
};

socket.onmessage = async (event) => {
    // 確保正確讀取二進位資料
    const data = new Uint8Array(event.data);
    term.write(data);
};

socket.onclose = () => term.write("\r\n[Connection Closed]\r\n");
socket.onerror = (err) => console.error("WS Error:", err);

// 使用 term.onData 處理輸入 (包含 Backspace 和 Enter)
term.onData(data => {
    if (socket.readyState === WebSocket.OPEN) {
        socket.send(data);
    }
});
</script>

    <script>
      // 1. 本地預覽邏輯：選完檔案立刻顯示在網頁上
      function previewLocalImage(input) {
        const preview = document.getElementById("new-preview");
        if (input.files && input.files[0]) {
          const reader = new FileReader();
          reader.onload = (e) => (preview.src = e.target.result);
          reader.readAsDataURL(input.files[0]);
        }
      }

      // 2. 修改原本的 uploadImage，成功後刷新「目前畫面」
      function uploadImage() {
        // ... 原有的 upload 邏輯 ...
        fetch("/api/upload-suspend", { method: "POST", body: formData })
          .then((res) => res.text())
          .then((msg) => {
            alert(msg);
            // 強制刷新目前畫面圖片 (加上時間戳記防止瀏覽器快取)
            document.getElementById("current-img").src =
              "/api/current-suspend?t=" + Date.now();
          });
      }
    </script>

    <script>
      fetch("/api/status")
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("model").innerText = data.model;
          document.getElementById("uptime").innerText = data.uptime;
          document.getElementById("storage").innerText = data.storage;
        });
    </script>
  </body>
</html>
